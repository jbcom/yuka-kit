name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Release Please PRs only package already-merged commits. Dependabot's
    # npm grouped non-major PRs are similarly narrow, lockfile-backed updates.
    # Keep a successful workflow result instead of path-filtering the workflow:
    # required workflows filtered out at trigger time remain pending on GitHub.
    if: >-
      github.event_name != 'pull_request' ||
      (!(github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'release-please--')) &&
       !(github.event.pull_request.user.login == 'app/dependabot' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/non-major-dependencies-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # setup-node otherwise discovers pnpm before Corepack has supplied it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in sync
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm docs:build
      # A published package whose types or exports are broken is worse than one
      # that fails to build: consumers only find out at integration time.
      - name: Package is consumable
        run: |
          pnpm dlx publint
          pnpm dlx @arethetypeswrong/cli --pack .
