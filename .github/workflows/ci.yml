name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Release Please PRs only package already-merged commits. Dependabot's
    # grouped non-major PRs are similarly narrow, lockfile-backed updates.
    # Keep a successful workflow result instead of path-filtering the workflow:
    # required workflows filtered out at trigger time remain pending on GitHub.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'release-please[bot]' &&
       !(github.event.pull_request.user.login == 'dependabot[bot]' &&
         startsWith(github.event.pull_request.title, 'Bump the non-major-dependencies group')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in sync
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build
      # A published package whose types or exports are broken is worse than one
      # that fails to build: consumers only find out at integration time.
      - name: Package is consumable
        run: |
          pnpm dlx publint
          pnpm dlx @arethetypeswrong/cli --pack .
