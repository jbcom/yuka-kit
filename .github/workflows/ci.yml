name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in sync
        if: matrix.node == '26'
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm verify

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install --disable-pip-version-check pre-commit==4.6.1
      - run: pre-commit run --all-files --show-diff-on-failure

  legacy-verify:
    # Retain the currently installed ruleset check until policy is migrated.
    name: verify
    needs: [verify, pre-commit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require verification and hooks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$PRE_COMMIT_RESULT" = success

  gate:
    name: CI / gate
    needs: [verify, pre-commit, legacy-verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI validation job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = Object.values(JSON.parse(process.env.NEEDS_JSON));
            if (!jobs.every(({ result }) => ["success", "skipped"].includes(result))) {
              process.exit(1);
            }
          '
