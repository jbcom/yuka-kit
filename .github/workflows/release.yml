name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The organization PAT is deliberately used here rather than the
          # ephemeral GITHUB_TOKEN: GitHub suppresses workflow triggers for
          # pull requests created with GITHUB_TOKEN, leaving a release PR
          # without the checks that protect main.
          token: ${{ secrets.CI_GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token is what lets npm verify the build provenance and, once the
      # package exists and the repo is public, publish without a token at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # setup-node otherwise discovers pnpm before Corepack has supplied it.
          package-manager-cache: false
      - name: Check the registry
        id: registry
        # A version that is already on npm is never published twice. A package
        # that does not exist on npm at all has no trusted publisher yet, so its
        # first publication is made by hand from this release tag (see
        # docs/RELEASING.md); that case is a visible warning, not a failed job.
        # Any other lookup failure fails the job.
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if lookup="$(npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org 2>&1)"; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm verify
            node scripts/verify-published-artifact.mjs
            echo "::notice::${package_name}@${package_version} is already on npm; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' <<<"${lookup}"; then
            if package_lookup="$(npm view "${package_name}" name --registry=https://registry.npmjs.org 2>&1)"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            elif grep -q 'E404' <<<"${package_lookup}"; then
              echo "::warning::${package_name} does not exist on npm yet, so it has no trusted publisher; publish ${package_version} by hand from this tag."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "${package_lookup}" >&2
              exit 1
            fi
          else
            echo "${lookup}" >&2
            exit 1
          fi
      - if: steps.registry.outputs.publish == 'true'
        run: corepack enable
      - if: steps.registry.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.registry.outputs.publish == 'true'
        run: pnpm verify
      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        # NPM_TOKEN is only needed until trusted publishing is configured for
        # this repo; then drop the env block and the id-token permission alone
        # is sufficient.
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public registry publication
        if: steps.registry.outputs.publish == 'true'
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org | grep -Fx "${package_version}"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "Published package was not visible in the public npm registry after 60 seconds." >&2
          exit 1
