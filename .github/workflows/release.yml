name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The organization PAT is deliberately used here rather than the
          # ephemeral GITHUB_TOKEN: GitHub suppresses workflow triggers for
          # pull requests created with GITHUB_TOKEN, leaving a release PR
          # without the checks that protect main.
          token: ${{ secrets.CI_GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token is what lets npm verify the build provenance and, once the
      # package exists and the repo is public, publish without a token at all.
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # setup-node otherwise discovers pnpm before Corepack has supplied it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Publish
        # NPM_TOKEN is only needed until the package exists on npm. Once it does
        # and trusted publishing is configured for this repo, drop the env block
        # and the id-token permission alone is sufficient.
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public registry publication
        run: |
          package_version="$(node -p \"require('./package.json').version\")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "@jbdevprimary/yuka-kit@${package_version}" version --registry=https://registry.npmjs.org | grep -Fx "${package_version}"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "Published package was not visible in the public npm registry after 60 seconds." >&2
          exit 1
