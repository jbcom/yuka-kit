name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The organization PAT is deliberately used here rather than the
          # ephemeral GITHUB_TOKEN: GitHub suppresses workflow triggers for
          # pull requests created with GITHUB_TOKEN, leaving a release PR
          # without the checks that protect main.
          token: ${{ secrets.CI_GITHUB_TOKEN }}
      - name: Record the release created by this run
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { RELEASE_TAG: tag, RELEASE_SHA: sha, RUNNER_TEMP } = process.env;
          writeFileSync(`${RUNNER_TEMP}/npm-release.json`, JSON.stringify({ tag, sha }));
          NODE
      - name: Hand the created release to CD
        if: steps.release.outputs.release_created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release.json
          if-no-files-found: error
