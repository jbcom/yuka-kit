name: CD

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    if: github.event.workflow_run.name == 'Release' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - id: release
        name: Find a release created from this trusted main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$(gh api "repos/$REPOSITORY/releases" --paginate --jq ".[] | select(.target_commitish == \"$HEAD_SHA\") | .tag_name" | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.tag != ''
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.release.outputs.tag != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.tag != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.release.outputs.tag != ''
        run: pnpm install --frozen-lockfile
      - if: steps.release.outputs.tag != ''
        run: pnpm verify
      - name: Check the registry
        id: registry
        if: steps.release.outputs.tag != ''
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if lookup="$(npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org --userconfig=/dev/null 2>&1)"; then
            node scripts/verify-published-artifact.mjs
            echo "::notice::${package_name}@${package_version} is already on npm; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' <<<"${lookup}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "${lookup}" >&2
            exit 1
          fi
      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --access public --provenance
      - name: Verify public registry publication
        if: steps.registry.outputs.publish == 'true'
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org --userconfig=/dev/null | grep -Fx "${package_version}"; then
              node scripts/verify-published-artifact.mjs
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "Published package was not visible in the public npm registry." >&2
          exit 1
